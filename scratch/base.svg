<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" style="background-color: #ffffff;">
  <text x="500" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333333">PLANTILLA BASE CARRUSEL</text>
  <text x="500" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666666">Cilindro Base (16:9 slots intercalados)</text>

  <!-- Base strip boundary (cut lines) -->
  <rect x="50" y="350" width="900" height="300" fill="none" stroke="#000000" stroke-width="4" />
  
  <!-- Glue tab -->
  <polygon points="50,350 20,380 20,620 50,650" fill="#e6e6e6" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Slots -->
  <!-- Slot 1: x=0.20 -> 200, y=0.50 -> 500, width=0.20 (200), height=0.11 (110) -->
  <rect x="100" y="445" width="200" height="110" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="5,4" />
  <text x="200" y="495" font-family="Arial, sans-serif" font-size="16" fill="#ea580c" text-anchor="middle" font-weight="bold">SLOT 1 (16:9)</text>
  
  <text x="350" y="500" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1" text-anchor="middle" font-weight="bold">ARTE AQUI</text>

  <!-- Slot 2: x=0.50 -> 500 -->
  <rect x="400" y="445" width="200" height="110" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="5,4" />
  <text x="500" y="495" font-family="Arial, sans-serif" font-size="16" fill="#ea580c" text-anchor="middle" font-weight="bold">SLOT 2 (16:9)</text>

  <text x="650" y="500" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1" text-anchor="middle" font-weight="bold">ARTE AQUI</text>

  <!-- Slot 3: x=0.80 -> 800 -->
  <rect x="700" y="445" width="200" height="110" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="5,4" />
  <text x="800" y="495" font-family="Arial, sans-serif" font-size="16" fill="#ea580c" text-anchor="middle" font-weight="bold">SLOT 3 (16:9)</text>
</svg>
