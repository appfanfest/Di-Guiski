<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>¡Di Guiski! | Tu App de Momentos y Eventos Festivos</title>
    <meta name="description" content="Bienvenido a ¡Di Guiski! Captura momentos especiales con fotos, realidad aumentada, álbumes y postales en PDF." />
    <meta name="keywords" content="di guiski, fotos, filtros, eventos, realidad aumentada, albumes, pdf, festivos" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://di-guiski.vercel.app/" />
    <meta property="og:title" content="¡Di Guiski!: Fotos, Realidad Aumentada, Álbumes y Postales PDF" />
    <meta property="og:description" content="Filtros y momentos memorables." />
    <meta property="og:image" content="/di-guiski-logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="¡Di Guiski!: Fotos, Realidad Aumentada, Álbumes y Postales PDF" />
    <meta property="twitter:description" content="Filtros y momentos memorables." />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
